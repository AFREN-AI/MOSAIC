name: CI

# One workflow: every run tests and packs; a v* tag also publishes the exact
# packages that were tested, once build-test and wrapper-checks have passed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Resolve package version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          else
            PACKAGE_VERSION="$(dotnet msbuild src/Mosaic.Core/Mosaic.Core.csproj -getProperty:Version)"
          fi
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be a semantic version, got '$PACKAGE_VERSION'." >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
      - run: dotnet restore MOSAIC.slnx
      - run: dotnet test MOSAIC.slnx --configuration Release --no-restore
      - run: dotnet run --project samples/Mosaic.Demo --configuration Release --no-restore
      - name: Pack libraries
        run: |
          dotnet pack src/Mosaic.Core/Mosaic.Core.csproj --configuration Release --no-restore --output packages -p:PackageVersion="$PACKAGE_VERSION"
          dotnet pack src/Mosaic.Mcp/Mosaic.Mcp.csproj --configuration Release --no-restore --output packages -p:PackageVersion="$PACKAGE_VERSION"
          test -s "packages/AfrenAI.Mosaic.$PACKAGE_VERSION.nupkg" && test -s "packages/AfrenAI.Mosaic.Mcp.$PACKAGE_VERSION.nupkg"
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/*.nupkg
          if-no-files-found: error

  wrapper-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Container sandbox runtime syntax
        run: node --check sandbox/runner.mjs
      - uses: actions/setup-go@v7
        with:
          go-version-file: wrappers/go/go.mod
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8.4"
          cabal-version: "3.12.1.0"
      - uses: dtolnay/rust-toolchain@stable
      - name: TypeScript and JavaScript wrapper
        working-directory: wrappers/typescript
        run: npm install && npm test
      - name: Python wrapper
        run: python -m pip install pytest -e wrappers/python && python -m pytest wrappers/python/tests
      - name: Go wrapper
        working-directory: wrappers/go
        run: go test ./...
      - name: C wrapper
        run: cmake -S wrappers -B wrappers/build && cmake --build wrappers/build && ctest --test-dir wrappers/build --output-on-failure
      - name: Ruby wrapper
        working-directory: wrappers/ruby
        run: ruby -Ilib test/test_mosaic_plan.rb
      - name: Haskell wrapper
        working-directory: wrappers/haskell
        run: cabal test all
      - name: Rust wrapper
        working-directory: wrappers/rust
        run: cargo test

  publish:
    needs: [build-test, wrapper-checks]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # NuGet.org Trusted Publishing exchanges the GitHub OIDC token for a short-lived API key.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "packages/*.nupkg" --source https://nuget.pkg.github.com/AFREN-AI/index.json --api-key "$GITHUB_TOKEN" --skip-duplicate
      - name: NuGet.org login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
