name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MOSAIC.slnx
      - run: dotnet test MOSAIC.slnx --configuration Release --no-restore
      - run: dotnet run --project samples/Mosaic.Demo --configuration Release --no-restore
