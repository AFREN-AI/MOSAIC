name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MOSAIC.slnx
      - run: dotnet test MOSAIC.slnx --configuration Release --no-restore
      - run: dotnet run --project samples/Mosaic.Demo --configuration Release --no-restore

  wrapper-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: wrappers/go/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: TypeScript and JavaScript wrapper
        working-directory: wrappers/typescript
        run: npm install && npm test
      - name: Python wrapper
        run: python -m pip install pytest -e wrappers/python && python -m pytest wrappers/python/tests
      - name: Go wrapper
        working-directory: wrappers/go
        run: go test ./...
      - name: C wrapper
        run: cmake -S wrappers/c -B wrappers/c/build && cmake --build wrappers/c/build && ctest --test-dir wrappers/c/build --output-on-failure
      - name: Rust wrapper
        working-directory: wrappers/rust
        run: cargo test
