name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MOSAIC.slnx
      - run: dotnet test MOSAIC.slnx --configuration Release --no-restore
      - run: dotnet run --project samples/Mosaic.Demo --configuration Release --no-restore

  wrapper-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: wrappers/go/go.mod
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: haskell/actions/setup@v2
        with:
          ghc-version: "9.8.4"
          cabal-version: "3.12.1.0"
      - uses: dtolnay/rust-toolchain@stable
      - name: TypeScript and JavaScript wrapper
        working-directory: wrappers/typescript
        run: npm install && npm test
      - name: Python wrapper
        run: python -m pip install pytest -e wrappers/python && python -m pytest wrappers/python/tests
      - name: Go wrapper
        working-directory: wrappers/go
        run: go test ./...
      - name: C wrapper
        run: cmake -S wrappers -B wrappers/build && cmake --build wrappers/build && ctest --test-dir wrappers/build --output-on-failure
      - name: Ruby wrapper
        working-directory: wrappers/ruby
        run: ruby -Ilib test/test_mosaic_plan.rb
      - name: Haskell wrapper
        working-directory: wrappers/haskell
        run: cabal test all
      - name: Rust wrapper
        working-directory: wrappers/rust
        run: cargo test
